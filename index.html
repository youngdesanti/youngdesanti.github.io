<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young W. Desanti — Advanced Product Development & Elastomer Engineering</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Deus Ex Corporate / Aug Palette */
            --gates-dark: #080808;      /* Pure Void Black */
            --gates-surface: #111111;   /* Charcoal / Carbon */
            --gates-card: #181818;      
            --gates-red: #d3a052;       /* DX Gold */
            --gates-red-hover: #fce29f; /* Bright Gold */
            --gates-orange: #cfa858;    /* Matte Gold */
            --gates-green: #8a959e;     /* Muted Steel/Cyber Gray */
            --text-main: #f0f0f0;       /* Crisp White */
            --text-muted: #808080;      /* Medium Gray */
            --border-color: #2a2a2a;    /* Subtle separation lines */
            --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--gates-dark);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Geometric Prism / Tech-Noir Background */
        .industrial-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: 
                linear-gradient(45deg, rgba(211, 160, 82, 0.03) 0%, transparent 40%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
                linear-gradient(to bottom, transparent 90%, rgba(211, 160, 82, 0.02) 100%);
            background-color: var(--gates-dark);
        }

        /* Grid lines overlay */
        .industrial-bg::after {
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.5;
        }

        /* Praxis / UI Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 3rem;
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        /* Gold glowing bottom accent */
        header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--gates-red) 50%, transparent 100%);
            opacity: 0.5;
        }

        .logo {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Triangle indicator (classic DX) */
        .logo-indicator {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 12px solid var(--gates-red);
            background: transparent;
            filter: drop-shadow(0 0 5px rgba(211, 160, 82, 0.6));
        }

        nav {
            display: flex;
            gap: 0.5rem;
            background: transparent;
            padding: 0;
            border: none;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 0.5rem 1.25rem;
            text-transform: uppercase;
            transition: var(--transition);
            position: relative;
        }

        /* DX Underline effect */
        .nav-btn::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background-color: var(--gates-red);
            transition: width 0.3s ease;
        }

        .nav-btn:hover {
            color: var(--gates-red);
        }

        .nav-btn:hover::before {
            width: 100%;
        }

        .nav-btn.active {
            color: var(--gates-dark);
            background: var(--gates-red);
            font-weight: 700;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .nav-btn.active::before {
            display: none;
        }

        /* Main Content Frame */
        main {
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem 2rem;
            position: relative;
            z-index: 1;
        }

        .tab-content {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Layouts */
        .grid-layout {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 2rem;
            margin-top: 0;
            align-items: start;
        }

        /* Hero Section (Top Left) */
        .hero-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 2rem;
            padding: 0;
            text-align: left;
            height: 100%;
        }

        .hero-graphics {
            flex-shrink: 0;
        }

        /* Angled Tech Frame for Photo */
        .profile-photo {
            width: 180px;
            height: 180px;
            border-radius: 0;
            object-fit: cover;
            /* Chamfered Octagon */
            clip-path: polygon(20% 0, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 20%);
            border: none;
            background-color: var(--gates-surface);
            filter: grayscale(80%) sepia(50%) hue-rotate(15deg) contrast(1.2) brightness(0.9);
        }

        .hero-section h1 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;
            color: var(--text-main);
            text-transform: uppercase;
            font-weight: 700;
        }

        .hero-section h2 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--gates-red);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .hero-section p {
            max-width: 700px;
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.7;
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem;
        }

        /* Chamfered Augmentation Cards */
        .card {
            background-color: rgba(17, 17, 17, 0.8);
            border: 1px solid var(--border-color);
            background-image: linear-gradient(135deg, rgba(211, 160, 82, 0.05) 0%, transparent 40%);
            padding: 2.5rem;
            transition: var(--transition);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 25px), calc(100% - 25px) 100%, 0 100%);
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--gates-red);
            opacity: 0.7;
            transition: var(--transition);
        }

        .card:hover {
            border-color: rgba(211, 160, 82, 0.3);
            background-color: rgba(26, 26, 26, 0.9);
        }

        .card:hover::before {
            opacity: 1;
            box-shadow: 0 0 10px var(--gates-red);
        }

        .card h3 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .card h4 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.9rem;
            color: var(--gates-red);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .card ul {
            list-style: none;
        }

        .card li {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .card li strong {
            color: var(--gates-red-hover);
            font-weight: 500;
        }
        
        /* Video Wrapper Settings */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            border: 1px solid var(--border-color);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            background-color: var(--gates-dark);
            transition: var(--transition);
        }
        
        .video-wrapper:hover {
            border-color: var(--gates-red);
        }
        
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Inline Text Links */
        .text-link {
            color: var(--gates-red);
            text-decoration: none;
            border-bottom: 1px solid rgba(211,160,82,0.3);
            transition: var(--transition);
            font-weight: 500;
        }

        .text-link:hover {
            color: var(--gates-red-hover);
            border-bottom-color: var(--gates-red-hover);
        }

        .education-item {
            white-space: normal;
        }

        .education-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .education-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .education-link {
            font-size: 0.85rem;
        }

        .education-detail {
            font-size: 0.8rem;
            display: block;
            margin-top: 4px;
        }

        /* Stack & Badges Grouping */
        .badge-group-title {
            display: block;
            font-size: 0.75rem;
            color: var(--gates-red);
            margin-bottom: 0.6rem;
            font-family: 'Roboto Condensed', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.2rem;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        /* Angled UI Badges */
        .badge {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.4rem 0.8rem;
            font-size: 0.7rem;
            font-family: 'Roboto Condensed', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
            transition: var(--transition);
        }

        .badge.software {
            border-color: rgba(255,255,255,0.1);
            color: var(--text-main);
        }

        .badge.pe {
            border-color: var(--gates-red);
            color: var(--gates-red);
        }

        a.badge {
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        a.badge:hover, a.badge.pe:hover {
            background-color: var(--gates-red);
            color: var(--gates-dark);
            border-color: var(--gates-red);
        }

        /* Projects Section Specifics */
        .projects-intro {
            text-align: center;
            margin-bottom: 3rem;
        }

        .projects-intro h2 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .projects-intro p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 300;
        }

        .project-tile {
            background-color: rgba(17, 17, 17, 0.8);
            border: 1px solid var(--border-color);
            background-image: linear-gradient(135deg, rgba(211, 160, 82, 0.05) 0%, transparent 40%);
            padding: 2.5rem 1.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
            position: relative;
        }

        .project-tile::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--gates-red);
            opacity: 0.5;
            transition: var(--transition);
        }

        .project-tile:hover {
            border-color: rgba(211, 160, 82, 0.3);
            background-color: rgba(26, 26, 26, 0.9);
            transform: translateY(-3px);
        }
        
        .project-tile:hover::before {
            opacity: 1;
            box-shadow: 0 0 10px var(--gates-red);
        }

        .project-tile h3 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .project-tile-cta {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gates-red);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
        }

        /* Interactive Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: rgba(17, 17, 17, 0.95);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 3rem;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%);
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        .modal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gates-red);
        }

        .modal-card::-webkit-scrollbar { width: 8px; }
        .modal-card::-webkit-scrollbar-track { background: var(--gates-surface); }
        .modal-card::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 0; }
        .modal-card::-webkit-scrollbar-thumb:hover { background: var(--gates-red); }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 1.5rem; right: 1.5rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-close:hover {
            color: var(--gates-red);
        }

        .modal-card h2 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            text-transform: uppercase;
        }

        .modal-detail-row {
            margin-bottom: 1.25rem;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .detail-label {
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            color: var(--gates-red);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 0.3rem;
        }

        .detail-text {
            color: var(--text-muted);
        }

        /* Modal Media Styling */
        .modal-media-container {
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
            display: none;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .media-grid.single {
            grid-template-columns: 1fr;
        }

        .media-grid img, .media-grid video {
            width: 100%;
            height: 200px; 
            object-fit: contain; 
            border-radius: 0;
            border: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.4);
            cursor: pointer; 
            transition: transform 0.2s, border-color 0.2s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .media-grid img:hover, .media-grid video:hover {
            transform: scale(1.02);
            border-color: var(--gates-red);
        }

        .media-grid figure {
            margin: 0;
            text-align: center;
        }

        .media-grid figcaption {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-style: italic;
        }

        .project-links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .project-links a {
            color: var(--gates-red);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            font-weight: 500;
        }

        .project-links a:hover {
            color: var(--gates-red-hover);
            text-decoration: underline;
        }

        /* High-Res Lightbox */
        .lightbox-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            object-fit: contain;
            border: 1px solid var(--gates-red);
        }

        .lightbox-close {
            position: absolute;
            top: 2rem; right: 2rem;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            transition: color 0.2s;
            z-index: 3001;
        }

        .lightbox-close:hover {
            color: var(--gates-red);
        }

        /* Contact Section */
        .contact-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 50vh;
        }

        .contact-section h2 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .contact-section p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 2.5rem;
        }

        .btn-industrial {
            display: inline-block;
            background-color: var(--gates-red);
            color: var(--gates-dark);
            font-family: 'Roboto Condensed', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
            font-weight:
